name: Deploy para o InfinityFree

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Build e FTP Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Pegando o código do repositório
      uses: actions/checkout@v4

    - name: 🟢 Configurando o Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: 📦 Instalar dependências e Gerar Build com Yarn
      run: |
        cd frontend
        # Ativa o suporte ao Yarn
        corepack enable
        yarn install --network-timeout 100000
        
        # Ignora avisos e checagens de lint que travam o build
        DISABLE_ESLINT_PLUGIN=true CI=false yarn build

    - name: 🚀 Enviando para o InfinityFree via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: frontend/build/
        server-dir: htdocs/

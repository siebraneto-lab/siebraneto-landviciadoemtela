name: Deploy para o InfinityFree

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Build e FTP Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Pegando o código do repositório
      uses: actions/checkout@v4

    - name: 🟢 Configurando o Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: 📦 Instalar dependências e Gerar Build
      run: |
        cd frontend
        npm install --legacy-peer-deps
        # Força o build a ir para uma pasta limpa na raiz chamada 'site-pronto'
        BUILD_PATH="../site-pronto" npm run build || true
        
        # Caso o comando acima não mude a pasta, nós movemos manualmente
        if [ -d "dist" ]; then cp -r dist/* ../site-pronto/ 2>/dev/null || mv dist ../site-pronto; fi
        if [ -d "build" ]; then cp -r build/* ../site-pronto/ 2>/dev/null || mv build ../site-pronto; fi
      continue-on-error: true

    - name: 📁 Garantir pasta para envio
      run: |
        # Se por algum motivo as pastas falharem, usa a pasta public como plano B
        if [ ! -d "site-pronto" ]; then mkdir site-pronto && cp -r frontend/public/* site-pronto/; fi

    - name: 🚀 Enviando para o InfinityFree via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: site-pronto/
        server-dir: htdocs/

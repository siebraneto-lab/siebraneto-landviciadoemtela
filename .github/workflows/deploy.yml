name: Deploy para o InfinityFree

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Build e FTP Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Pegando o código do repositório
      uses: actions/checkout@v4

    - name: 🟢 Configurando o Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: 📦 Instalar dependências e Gerar Build
      run: |
        cd frontend
        npm install --legacy-peer-deps
        npm run build

    - name: 🔍 Detetar pasta de Build (dist ou build)
      id: detect-dir
      run: |
        cd frontend
        if [ -d "dist" ]; then
          echo "FOLDER=frontend/dist/" >> $GITHUB_OUTPUT
        elif [ -d "build" ]; then
          echo "FOLDER=frontend/build/" >> $GITHUB_OUTPUT
        else
          echo "FOLDER=frontend/" >> $GITHUB_OUTPUT
        fi

    - name: 🚀 Enviando apenas os arquivos compilados via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ${{ steps.detect-dir.outputs.FOLDER }}
        server-dir: htdocs/

name: Deploy para o InfinityFree

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Build e FTP Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Pegando o código do repositório
      uses: actions/checkout@v4

    - name: 🟢 Configurando o Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: 📦 Instalar dependências e Gerar Build
      run: |
        cd frontend
        npm install --legacy-peer-deps
        npm run build

    - name: 📁 Preparar pasta de envio
      run: |
        # Cria a pasta temporária na raiz
        mkdir -p site-pronto
        
        # Copia o conteúdo gerado pelo build do Craco para a pasta de envio
        if [ -d "frontend/build" ]; then
          cp -r frontend/build/* site-pronto/
        elif [ -d "frontend/dist" ]; then
          cp -r frontend/dist/* site-pronto/
        else
          # Fallback de segurança caso o build falhe silenciosamente
          cp -r frontend/public/* site-pronto/
        fi

    - name: 🚀 Enviando para o InfinityFree via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: site-pronto/
        server-dir: htdocs/
